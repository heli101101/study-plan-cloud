<script>
"use strict";
var MIND = [{"title":"第一章 肌肉活动","full":"第一章（肌肉活动）","color":"#c62828","groups":[{"g":"细胞生物电","qs":[{"n":9,"t":"简述动作电位的形成机制（旧版）","a":["（1）上升支。","※书中补充：动作电位产生时膜电位的波动是离子跨膜移动的结果。当刺激使膜去极化达到阈电位时，电压门控Na⁺通道开放，Na⁺在强大的内向电-化学驱动力作用下快速内流（内向电流），使膜内正电荷增多、膜电位迅速上升，形成上升支（去极化）。","（2）下降支。","※书中补充：Na⁺通道开放后随即进入失活状态，K⁺通道打开，K⁺顺浓度差外流形成外向电流，使膜内电位迅速下降、膜复极化，形成下降支；其后膜电位低于静息电位的部分称为后超极化电位。","（3）钠钾泵工作。","※书中补充：一次动作电位中跨膜移动的离子量很少（约为离子总量的万分之一），膜两侧离子浓度差基本不受影响；每次兴奋后，膜上钠钾泵将进入膜内的Na⁺泵出、将外流的K⁺泵回，以恢复并维持膜内外的离子浓度差，使细胞保持正常的兴奋性。","※出处：《运动生理学》（第4版，段锐、王健等主编）第二章第三节“细胞的生物电现象——动作电位的产生机制”，第19～20页（钠-钾泵维持离子浓度梯度见第二章第一节第11～12页）。"]},{"n":17,"t":"简述动作电位在神经纤维上传导的特点（p16）","a":["（1）生理完整性。","※书中补充：动作电位的传导依靠兴奋区与邻近未兴奋区之间形成局部电流，使邻近部位相继去极化并产生新的动作电位，因此要求神经纤维在结构和功能上保持完整，纤维受损后传导即发生障碍。","（2）双向传导：","※书中补充：神经纤维某一点受刺激产生动作电位后，可通过局部电流沿细胞膜向四周传播，使兴奋向两个方向传导；在完整神经干中，由于先前兴奋部位通道处于不应期，冲动按一定方向有序传导。","（3）不衰减和相对不疲劳性。","※书中补充：动作电位的幅度和波形在传播过程中始终保持不变，呈不衰减传导；其持续时间很短（神经细胞锋电位仅约1毫秒），每次兴奋后依靠离子泵恢复膜两侧离子浓度差，可连续产生兴奋，故相对不易疲劳。","（4）绝缘性。","※书中补充：一条神经干内包含许多条神经纤维，各纤维外有髓鞘等结构包绕绝缘，一条纤维的兴奋传导不会干扰邻近纤维，从而保证各纤维所传递的信号互不混淆。","※出处：《运动生理学》（第4版，段锐、王健等主编）第二章第三节“细胞的生物电现象——动作电位的传导”，第20～21页；动作电位不衰减、脉冲式发放等特点见第19页。"]}]},{"g":"神经—肌肉接头","qs":[{"n":10,"t":"神经—肌肉接头的兴奋传递过程（p28）","a":["神经-肌肉接点：是指运动神经纤维在到达所支配的骨骼肌时发出分支，形成末端膨大的神","经末梢，神经末梢与肌纤维接触前失去髓鞘，再以裸露末梢嵌入肌膜上，被称为终板膜在凹","陷中，形成所谓的神经-肌肉接点。","（1）当运动神经元兴奋时，神经冲动沿运动神经纤维传至轴突末梢，并刺激突触前膜去极","化，使膜上的钙通道开放，使得细胞外液中的钙离子进入突触前膜，触发轴浆中的囊泡向突","触前膜的内侧面靠近。","（2）囊泡与突触前膜融合，其中所含的乙酰胆碱被释放进入突触间隙，随后立即与突触后","膜的乙酰胆碱受体结合，引起突触后膜的钠离子和钾离子等离子的通透性改变，突触后膜除","极化，形成终板电位。终板电位通过局部电流作用，使邻近肌细胞膜去极化而产生动作电位，","实现了兴奋由神经传递给肌肉。","（3）由于突触间隙中和终板膜上有大量胆碱酯酶，在其作用下每次冲动从轴突末梢释放的","乙酰胆碱，能在约两毫秒的时间内被全部水解而失活，从而维持神经-肌肉接头下次正常的","传递功能。"]},{"n":11,"t":"兴奋在神经—肌肉接点的传递特点 （p28）","a":["（1）化学传递","※书中补充：神经和肌肉之间的兴奋传递是通过化学递质乙酰胆碱进行的。","（2）兴奋传递节律是一对一的","※书中补充：每一次神经纤维兴奋都可引起一次肌肉细胞兴奋；因为神经末梢每次动作电位所引起的乙酰胆碱释放量相当大，足以产生较大的终板电位，从而激发肌肉细胞兴奋。","（3）单向传递","※书中补充：兴奋只能由神经末梢传向肌肉，而不能相反。","（4）时间延搁","※书中补充：兴奋的传递要经历递质的释放、扩散和作用等多个环节，因而传递速度缓慢。","（5）高敏感性","※书中补充：易受化学和其他环境因素变化的影响，易疲劳。","※出处：《运动生理学》（第4版，段锐、王健等主编）神经—肌肉接头的兴奋传递特点，第28页。"]}]},{"g":"兴奋—收缩耦联与收缩机制","qs":[{"n":12,"t":"简述兴奋收缩耦联过程（p29）","a":["（1）当神经冲动经神经-肌肉接头传至骨骼肌细胞膜时,引起肌细胞膜产生动作电位并沿着","横管系统扩布至三联管处,使终板膜上的Ca+通道开放;","（2）储存在终池内的Ca+顺着浓度梯度迅速释放入肌质中,使肌质Ca+浓度比静息时提高100","倍,引起肌细胞收缩;","（3）当神经冲动停止时，肌细胞膜和横管膜电位恢复,引起终池Ca+通道关闭。同时,肌质","Ca+浓度升高激活肌质网膜上的钙泵,将Ca+逆浓度梯度回收到终池,引起肌细胞舒张。"]},{"n":13,"t":"骨骼肌收缩和舒张的分子机制/原理（p29）（微观）","a":["在分子水平上肌肉收缩实际上是构成粗肌丝的肌球蛋白和构成细肌丝的肌动蛋白相互作用","的结果，而细肌丝中的原肌球蛋白和肌钙蛋白则起着控制作用。","（1）当肌细胞兴奋动作电位引起肌浆钙离子的浓度升高时，钙离子与细肌丝上肌钙蛋白结","合，引起肌钙蛋白分子构型发生变化，这种变化又传递给原肌球蛋白分子使后者构型发生变","化，使原肌球蛋白从肌动蛋白双螺旋结构的沟沿滑到沟底，安静时抑制肌动蛋白和横桥结合","的因素被解除，暴露出肌动蛋白上能与横桥结合的位点，","（2）横桥与肌动蛋白结合形成肌动球蛋白。肌动球蛋白可激活横桥上的 ATP 酶，在钙离","子参与下，ATP 分解释放能量引起横桥头部向粗肌丝中心方向摆动，牵引细肌丝向粗肌丝","中央滑行。当横桥角度发生变化时，横桥头部与肌动蛋白解脱，并恢复到原来垂直的位置紧","接着横桥又开始与下一个肌动蛋白的位点结合，重复上述过程，进一步牵引细肌丝向粗肌丝","中央滑行。只要肌浆中钙离子浓度不下降，横桥循环运动就不断进行下去，将细肌丝逐步拖","向粗肌丝中央，于是肌小节缩短，肌肉出现缩短。","（3）当刺激中止后，终池膜对钙离子通透性降低，钙离子释放也停止。肌浆膜上的钙泵迅","速回收钙离子，使肌浆钙离子浓度下降，钙与肌钙蛋白结合解离，肌钙蛋白恢复到原来构型，","继而原肌球蛋白也恢复到原来构型，肌动蛋白上与横桥结合的位点被重新掩盖起来横桥与肌","动蛋白分离，粗、细肌丝退回到原来位置，肌小节变长，肌肉产生舒张。"]}]},{"g":"肌肉收缩的力学特征","qs":[{"n":14,"t":"简述肌肉收缩的负荷阻力与收缩速度的关系（p33）","a":["在缩短收缩条件下,当肌肉收缩力大于负荷阻力时,肌肉开始以相对恒定的速度缩短。此时若","以肌肉负荷阻力和收缩速度为观察指标,通过逐渐增大负荷阻力的方法，可以观察到随着负","荷阻力增加,肌肉收缩速度随之减慢;相反,在拉长收缩条件下，当肌肉收缩力小于负荷阻力时,","肌肉以相对恒定的速度拉长。此时,若以肌肉负荷阻力和收缩速度为观察指标,通过逐渐增大","负荷阻力的方法，可以观察到随着负荷阻力增加,肌肉收缩速度随之加快。将以上肌肉在缩","短和拉长收缩条件下负荷阻力与收缩速度变化描绘在直角坐标系上,可以获得肌肉收缩的","“负荷阻力-收缩速度曲线”。","该曲线说明：","（1）在缩短收缩条件下,肌肉收缩的负荷阻力或收缩张力与收缩速度成反比;当负荷阻力增加","到某一数值时,肌肉收缩速度为零;当负荷阻力为零时,理论上收缩速度将达到最大。","（2）在拉长收缩条件下，肌肉收缩负荷阻力或收缩张力与速度成正比，负荷阻力越大，肌","肉张力越大，拉长收缩速度越快。","（3）在相同绝对收缩速度条件下,拉长收缩所产生的肌肉张力通常较缩短收缩大1.2~2.4倍，","但能耗却明显少于缩短收缩，这一现象较好地解释了为什么负重下蹲的负荷重量总是大于负","重蹲起的负荷重量，而负重下蹲的能量消耗却总是明显小于负重蹲起的能量消耗，这可能与","拉长收缩过程中肌联蛋白的分子弹簧作用和单位横桥循环ATP消耗较少等有关。"]},{"n":15,"t":"简述肌肉收缩的长度与张力的关系及生理机制（p34）","a":["（1）若在肌肉收缩前施加于肌肉一定负荷，使肌肉收缩前就处于某种被拉长状态，即改变","肌肉初长度。当适当增大肌肉收缩的初长度时，肌肉收缩时产生的张力也在增加，但当初长","度增大超过某一程度时，张力反而减小。","（2）如果在坐标图上将肌肉在不同前负荷作用下长度与张力的变化绘制成图，就可以得到","一条曲线，该曲线称为肌肉收缩的长度-张力曲线。","（3）该曲线类似开口向下的抛物线，其顶点显示适宜初长度时，肌肉收缩产生的张力最大。","生理机制：长度和张力的关系可用肌肉收缩的肌丝滑行理论解释。","（1）在一定范围内适当增加前负荷-肌肉初长度,可以造成骨骼肌收缩时粗、细肌丝之间形","成的横桥连接数量增多,产生的肌肉收缩力也相应增大。","（2）在最适前负荷-初长度时形成的横桥连接数量最多,收缩效果最佳。如果初长度过长,则","有一段细肌丝将会从粗肌丝之间拉出,收缩时形成的横桥连接数量反而减少,造成肌肉收缩力","下降;如果初长度过短,细肌丝将会在肌小节中部分卷曲或者重叠,形成的横桥连接数量减少,","因而造成肌肉收缩力减弱。"]}]},{"g":"肌纤维类型与运动单位","qs":[{"n":16,"t":"简述运动训练对骨骼肌纤维的影响（p40）","a":["训练能使肌纤维产生适应性变化，主要表现为：","（1）改变骨骼肌纤维比例构成","（2）训练能使肌纤维出现选择性肥大","（3）训练能显著提高肌纤维的代谢能力"]},{"n":18,"t":"简述运动单位募集（原则）（p39）","a":["骨骼肌运动单位的募集具有以下几个特征:","（1）运动单位募集数量/大小原则:","（2）运动单位募集顺序/顺序原则:","（3）不同强度运动时不同类型运动单位的募集数量:"]},{"n":19,"t":"简述肌纤维类型与运动的关系（旧版）","a":["（1）依据肌纤维百分组成与运动能力的关系，可为运动员选取更为适合他们的运动项目。","（2）但也应注意，两类肌纤维百分组成与运动能力及运动专项的对应关系，也并非是绝对","的。","（3）在运动实践中，即使运动员不具备其所从事专项的相应肌纤维类型优势，由于充分发","挥其他因素的作用，也可能取得好的成绩。","（4）因为优秀运动成绩最终是由运动员生理、生化和生物力学等综合因素决定的，在实践","中既要关注科学选材，又要高度重视科学训练。"]},{"n":20,"t":"不同类型骨骼肌的形态、代谢和生理特征（论述）","a":["（1）形态特征","①结构特征","②神经支配","③肌纤维面积","（2）代谢特征","①代谢底物","②代谢酶活性","（3）生理特征","①收缩速度","②收缩力量","③抗疲劳性"]}]}],"count":12},{"title":"第二章 能量代谢","full":"第二章（能量代谢）","color":"#ef6c00","groups":[{"g":"三大供能系统","qs":[{"n":21,"t":"论述ATP的生成途径/简述三大能量供应系统的供能特点（p45-47）","a":["（1）磷酸原系统","（2）糖酵解系统","（3）有氧氧化系统：","①糖类","②脂质","③蛋白质"]}]},{"g":"不同运动状态的供能形式","qs":[{"n":22,"t":"不同运动状态时的供能形式（p50）","a":["（1）短时间爆发性运动","（2）短时间高强度运动","（3）长时间低强度运动","（4）高强度间歇训练"]}]},{"g":"运动与能量代谢（反应/适应）","qs":[{"n":23,"t":"能量代谢对急性运动的反应（p53-54）","a":["（1）急性运动时的无氧代谢","（2）急性运动时的有氧代谢","（3）急性运动能量代谢的整合"]},{"n":24,"t":"能量代谢对慢性运动的适应（p55）","a":["（1）一般而言，长期运动不仅能够有效增加肌糖原的储备量,使能量代谢的底物水平提高,","还可上调参与主要能量代谢途径的关键酶的活性,使其对神经、激素的调节更加敏感,内环境","变化时各器官、系统的功能更加协调。","（2）长期从事耐力性运动可使骨骼肌线粒体密度增加，增加骨骼肌利用脂肪供能的能力而","减少其对血糖的利用率;同时加速能源物质及各代谢调节系统的恢复,促进疲劳的消除。","（3）长期运动对能量代谢的影响还可以用运动节省化或跑步经济性来反映。"]},{"n":25,"t":"运动训练会对肌肉能量代谢产生哪些影响 （旧版）","a":["通过长期的运动训练会对肌肉能量代谢产生下列影响：","（1）提高肌糖原贮备量。","（2）使骨骼肌的能量转换效率明显提高。","（3）促进能量代谢产物的清除。","（4）能源物质的恢复。"]}]},{"g":"影响能量代谢的因素","qs":[{"n":26,"t":"简述影响能量代谢的因素 （p57-58）","a":["（1）肌肉活动","（2）环境温度","（3）进食","（4）精神和情绪活动","（5）其他因素"]}]}],"count":6},{"title":"第三章 神经系统的调节功能","full":"第三章（神经系统的调节功能）","color":"#2e7d32","groups":[{"g":"神经纤维与神经胶质细胞","qs":[{"n":79,"t":"简述神经纤维传导兴奋的几个特征（p141）","a":["（1）完整性。","（2）绝缘性。","（3）双向性。","（4）相对不疲劳性。"]},{"n":80,"t":"简述神经胶质细胞的类型和特征（p142）","a":["（1）星形胶质细胞","支持作用。","引导迁移作用。","①","营养作用。","②","隔离作用。","③","④","（2）少突胶质细胞和施万细胞的主要功能","（3）小胶质细胞和卫星细胞的功能"]}]},{"g":"反射与突触传递","qs":[{"n":81,"t":"简述反射的基本过程（反射活动的整合）（p146）","a":["（1）反射的基本过程是刺激信息经感受器、传入神经、中枢、传出神经和效应器依次传递","的过程，中枢是反射弧中最复杂的部位。","（2）在整体情况下，无论是简单的还是复杂的反射，传入冲动进入脊髓或脑干后，除在同","一水平与传出部分发生联系并发出传出冲动外，还有上行冲动传到更高级的中枢部位进一步","整合，再由高级中枢发出冲动来调整反射的传出冲动。","（3）因此，完成一个反射，往往既有初级水平的整合活动，也有高级水平的整合活动，在","通过多级水平的整合后，反射活动将更具复杂性和适应性。"]},{"n":82,"t":"中枢神经元有哪些联系方式（都可以参考名词解释）（p146）","a":["（1）单线式联系","（2）辐散式联系","（3）聚合式联系","（4）链锁式和环式联系"]},{"n":83,"t":"中枢兴奋在化学性突触传递的特征（p146-147）","a":["（1）单向传播","（2）中枢延搁","（3）兴奋的总和","（4）兴奋节律的改变","（5）后发放","（6）对内环境变化敏感和易疲劳"]}]},{"g":"感觉功能与感受器","qs":[{"n":84,"t":"简述感受器的一般生理特性（p150）","a":["（1）适宜刺激。","（2）换能作用。","（3）编码功能。","（4）适应现象。"]},{"n":88,"t":"简述体表感觉代表区的感觉投射规律/大脑皮质对运动的调控功能特征 （p163）","a":["（1）对躯体运动调节为交叉性支配，即一侧皮质支配对侧躯体的肌肉。","（2）具有精细的功能定位，运动愈精细其愈复杂的肌肉，其皮质代表区的面积愈大。","（3）运动区定位从上到下的安排是倒置的。即下肢肌肉的代表区在皮质顶部，膝关节以下","肌肉的代表区在内侧面上肢肌肉的代表区在中间部，而头面部肌肉的代表区在底部。"]},{"n":97,"t":"简述本体感受器其组成及意义（p152）","a":["（1）肌梭。","（2）腱器官。","（3）在关节囊、关节韧带及骨膜处还存在几种由皮肤相应的感受器变形而来的感受器；"]}]},{"g":"姿势与运动调控（脊髓/脑干水平）","qs":[{"n":85,"t":"简述牵张反射的过程及其生理意义（p161）","a":["在脊髓完整的情况下，一块骨骼肌如受到外力牵拉，使其伸长时，能反射性地引起受牵扯的","同一肌肉收缩，这种反射活动称为牵张反射。","牵张反射表现为腱反射和肌紧张两种形式。","（1）动态牵张反射也称为腱反射，是由快速牵拉肌肉引起，它的作用是对抗肌肉的拉长，","其特点是时长较短和产生较大的肌力，并发生一次位相性收缩。","（2）静态牵张反射也称为肌紧张，是在缓慢持续牵拉肌肉时而形成的，主要调节肌肉的紧","张度，不表现出明显的动作，但对维持躯体姿势非常重要。","（3）牵张反射的主要生理意义在于维持站立姿势，如果肌肉在收缩前适当牵拉肌肉肌亦可","以增强其收缩的力量。","（4）例如，掷标枪时的引臂和跳高起跳前的屈膝动作，都是通过牵拉主动肌，刺激其中的","肌梭，通过肌梭的传入纤维，把兴奋冲动传到中枢，加强支配该肌的a运动神经元的兴奋，","使其收缩更加有力。","（5）因此，对于任何需要较大力量的运动来说，在一定范围内尽可能快速牵拉肌肉是必要","的，但在牵拉与随后的收缩之间的延搁时间应尽可能短，否则牵拉引起的增力效果将不明显。"]},{"n":86,"t":"状态反射包括哪两种形式？简述其机制（p162）","a":["状态反射是指头部空间位置的改变以及头部与躯干的相对位置发生改变时，将反射性地引起","躯干和四肢肌肉紧张性的改变，这种反射称为状态反射。","状态反射包括迷路紧张反射和颈紧张反射。","（1）迷路紧张反射","（2）颈紧张反射","状态反射规律：","（1）头部后仰引起上下肢及背部伸肌紧张性加强，使四肢伸直，背部挺直；","（2）头部前倾引起上下肢及背部伸肌紧张性减弱，屈肌及腹肌的紧张相对加强，四肢弯曲；","（3）头部侧倾或扭转时，引起同侧上下肢伸肌紧张性加强，异侧上下肢伸肌紧张性减弱。","（4）正常人体，由于高位中枢的存在，这类反射被抑制而表现不明显。状态反射在完成一","些运动技能时起着重要的作用。","（5）例如：体操运动员进行后手翻、后空翻或在平衡木上做动作时，如果头部位置不正，","就会使两臂伸肌力量不一致，身体随之失去平衡，常常导致动作的失误或无法完成动作。","（6）又如举重时，提杠铃至胸前瞬间头后仰，可借以提高肩背肌群的力量，更好地完成动","作。但任何运动技能都是在大脑皮质参与下实现的，在某些动作中，甚至可以表现出与状态","反射相反的规律。"]},{"n":87,"t":"简述翻正反射的过程及其机制 （p162）","a":["（1）当人和动物处于不正常体位时，通过一系列协调运动将体位恢复常态的反射活动称为","翻正反射。","（2）这类反射包括许多步骤，主要是由于头部位置不正，视觉和耳石器官受到刺激而兴奋，","传入的冲动反射性地引起头部位置率先复正。","（3）由于头部复正引起颈肌扭曲，从而使颈肌内的感受器发生兴奋，继而导致躯干翻转，","使动物恢复站立姿势。视觉在翻正反射中的作用是很重要的。","（4）在体育运动中，有许多动作就是在翻正反射的基础上形成的，例如跳水中的许多空翻","动作，都要先转头，再转上半身，然后再转下半身。"]},{"n":96,"t":"简述运动的类型（p159）","a":["（1）反射性运动","形式化运动","随意性运动"]}]},{"g":"高位中枢对运动的调控","qs":[{"n":89,"t":"简述大脑皮质的运动传导通路（p164）","a":["（1）大脑皮质对躯体运动的调控是通过皮质脊髓束和皮质脑干束两条传导通路而实现的。","（2）由皮质发出，经内囊、脑干下行，到达脊髓前角运动神经元的传导束，称为皮质脊髓","束，其功能是控制躯干和四肢肌肉，与姿势的维持和精细的、技巧性运动有关；","（3）而由皮质发出，经内囊到达脑干内各脑区运动神经元的传导束，称为皮质脑干束，其","功能是控制脑干运动神经元的活动。"]},{"n":90,"t":"简述基底神经节的功能 （p165）","a":["（1）参与运动的设计和程序编制，将一个抽象的设计转换为一个随意运动；","（2）对随意运动的产生和稳定、肌紧张的调节、本体感受传入冲动信息的处理等可能也有","关；","（3）基底神经节中某些核团还参与自主神经活动的调节、感觉传入、行为和学习记忆等功","能活动。"]},{"n":91,"t":"简述小脑的运动调节功能 （p166-167）","a":["（1）前庭小脑","（2）脊髓小脑","（3）皮质小脑"]},{"n":92,"t":"试述重力及直线正负加速度和旋转运动产生的生理机制（旧版）","a":["（1）重力及直线正负加速度的感受器是囊斑。当头部位置改变，由于重力对耳石的作用方","向改变，耳石膜与毛细胞之间的空间位置发生改变，使毛细胞兴奋，冲动经前庭神经传到前","庭神经核，反射性地引起躯干与四肢有关肌肉的肌紧张变化。","（2）同时冲动传入大脑皮质前庭感觉区，产生头部空间位置改变的感觉。人体做直线变速","运动开始、停止或突然变速时，耳石膜因直线加速度或减速度的惯性而发生位置偏移，使毛","细胞的纤毛弯曲，毛细胞兴奋，通过姿势反射来调整有关骨骼肌的张力，维持身体平衡。","（3）同时也有冲动经丘脑传入大脑皮质感觉区，产生身体在空间位置及变速的感觉。","（4）旋转运动的感受器是半规管壶腹嵴。当旋转运动开始、停止或突然变速时，由于内淋","巴的惯性作用，使终帽弯曲，刺激毛细胞兴奋，冲动经前庭神经传入中枢，产生旋转运动感","觉。","（5）在内耳迷路中两侧的水平半规管主要感受绕垂直轴左右旋转的变速运动。其他两对前、","后半规管形成前后轴和横轴成45°角排列，主要是感受绕前后轴和横轴旋转的变速运动。","因此，人体可以感受任何平面上不同方向旋转变速运动的刺激，并做出准确的反应。"]},{"n":95,"t":"随意运动的产生和调节（p167）","a":["（1）随意运动的发动是一个非常复杂的过程，主要包含设想、设计和执行几个环节；","（2）运动的设想起源于皮质联络区，运动的设计在大脑皮质和皮质下的基底神经节和小脑","皮质中进行，设计好的运动信息被传送到运动皮质(运动皮质和运动前区)，再由运动皮质发","出指令经运动传出通路到达脑干和脊髓运动神经元。","（3）在此过程中，运动的设计需在大脑皮质和皮质下的两个运动脑区之间不断进行信息交","流;","（4）运动的执行需要小脑半球中间部(脊髓小脑)的参与,后者利用其与脊髓、脑干和大脑皮","质之间的纤维联系,将来自肌肉、关节等处的感觉传入信息与大脑皮质发出的运动指令反复","进行比较,并修正大脑皮质的活动。","（5）外周感觉反馈信息也可直接传入运动皮质，经过对运动偏差的不断纠正，使动作变得","平稳而精确。"]}]},{"g":"自主神经与内脏调节","qs":[{"n":93,"t":"自主神经系统的功能特征（p169）","a":["（1）紧张性作用","（2）双重神经支配","（3）受效应器所处功能状态的影响"]},{"n":94,"t":"中枢神经系统对内脏活动的调节（低频）（p170）","a":["（1）脊髓对内脏活动的调节","（2）低位脑干对内脏活动的调节","（3）下丘脑对内脏活动的调节","（4）大脑对内脏活动的调节"]}]}],"count":19},{"title":"第四章 内分泌调节","full":"第四章（内分泌调节）","color":"#1565c0","groups":[{"g":"激素概述（调节作用/一般特征）","qs":[{"n":98,"t":"激素对机体功能的调节作用 （p175）","a":["（1）整合机体稳态。","（2）调节新陈代谢。","（3）维持生长发育。","（4）调控生殖过程。"]},{"n":99,"t":"激素作用的一般特征（p175）","a":["（1）信使作用","（2）高效作用","（3）特异作用","（4）相互作用"]}]},{"g":"激素的作用机制","qs":[{"n":100,"t":"细胞膜受体介导的激素作用机制（含氮类激素的作用机理）（p176）","a":["（1）携带调节信息的激素（第一信使）先与靶细胞膜上的特异受体结合。","（2）激素与受体结合后，激素受体通过G蛋白激活膜内侧腺苷酸环化酶（AC），在 Mg2+","存在的条件下，AC催化ATP转变为cAMP。","（3）cAMP作为“第二信使”，继续使胞质中无活性的蛋白激酶等功能蛋白逐级活化，促进","胞内许多底物的磷酸化。","（4）最终引起靶细胞产生各种生理效应。最后cAMP被磷酸二酯酶水解而失活。"]},{"n":101,"t":"细胞内受体介导的激素作用机制（类固醇激素的作用机理） （p176）","a":["（1）激素直接透过细胞膜进入胞质，与胞质中特异受体结合成激素受体复合物","（2）在Ca2+存在的条件下，复合物发生变构，并进入核内。","（3）与核内受体结合成激素-核受体复合物。","（4）促进DNA转录过程，促进或抑制mRNA的形成。","（5）诱导或减少新蛋白质（主要是酶）的生成，实现各种生物效应。"]}]},{"g":"主要内分泌腺及激素","qs":[{"n":102,"t":"甲状腺激素 （TH）的生理作用 （p180）","a":["（1）促进生长发育","（2）调节新陈代谢","（3）影响器官系统功能"]},{"n":103,"t":"甲状旁腺的内分泌功能（p181）","a":["（1）增强骨代谢，其调节具有双相效应，表现为间歇的信号增强成骨细胞活动，而持续的","信号增强破骨细胞活动，动员骨 Ca²+进入血液来升高血钙，促进成骨细胞分泌破骨分化因","子。","（2）促进肾远曲小管对钙的重吸收，抑制近曲小管对磷酸盐的重吸收，使尿钙减少，尿磷","增加。","（3）促进维生素 D3转化为活性形式，对钙在肠内的吸收具有促进作用。"]},{"n":104,"t":"糖皮质激素的生理作用（p182-183）","a":["（1）对物质代谢的作用","（2）对水盐代谢的作用","（3）在应激反应中的作用"]},{"n":105,"t":"胰岛素的主要生理作用（p184）","a":["（1）对糖代谢的作用","（2）对脂肪代谢的作用","（3）对蛋白质代谢的作用"]},{"n":106,"t":"胰高血糖素的生理作用（p185）","a":["（1）促进糖原分解和糖异生，使血糖升高的效应显著增强。","（2）活化脂肪细胞的脂肪酶，促进脂肪分解，血浆游离脂肪酸升高并促进肝摄取游离脂肪","酸，因此酮体生成增加。","（3）能使氨基酸迅速进入肝细胞，脱去氨基，异生为糖。","（4）促进蛋白质分解、抑制合成。","（5）增强心肌磷酸化酶的活性，增加Ca2+的积聚，从而增强心肌收缩能力，心输出量增加","和血压升高。"]},{"n":107,"t":"睾酮的生理作用（p185）","a":["（1）促进男性附性器官的发育和副性征的出现","（2）促进体内蛋白质合成"]}]},{"g":"运动与内分泌","qs":[{"n":108,"t":"试述激素对急性负荷的应答以及对长期运动的适应特征（p193）","a":["儿茶酚胺对运动的反应和适应","儿茶酚胺是肾上腺素与去甲肾上腺素的统称,属于应激激素,在运动时其含量的适度增高,可","提高心血管系统的功能、调节血液的重新分配、促进肝糖原和脂肪的分解等,对运动能力具","有明显的促进作用；儿茶酚胺的主要功能是动员呼吸循环机能、促进能量释放以提高身体功","能。在运动应激状态下,儿茶酚胺分泌增多,且程度与运动强度密切相关,即运动强度越大、升","高的幅度也越大,但两种激素升高的程度与运动后恢复状况并不完全同步。","随着运动训练持续进行，儿茶酚胺对同一运动强度增高的幅度越来越小。经过一段时间运动","训练后，完成同等运动负荷时儿茶酚胺的反应降低。表明运动能力得到提高，机体对同样负","荷刺激的“总的”反应变小。","糖皮质激素与促肾上腺皮质激素对运动的反应和适应","糖皮质激素和促肾上腺皮质激素也属于应激激素,在机体对刺激的应答性反应中,具有加快能","量代谢、更好地动员机体潜能的作用。糖皮质激素分泌增多是机体对刺激发生应答性变化的","基本反应,因此它的分泌活动与刺激的强度成正相关。研究发现,在完成小强度负荷时，血中","的糖皮质激素不会发生明显的改变,而在完成力竭性运动期间,由于刺激几乎达到最大,糖皮","质激素水平也相应明显升高,其作用是通过促进肝的糖异生活动,使体内的非糖物质加速生成","葡萄糖,为机体提供更的能源物质。","皮质醇是一种糖皮质激素,能够促进脂肪分解,增强脂肪酸在肝内的氧化过程有利于糖异生作","用,其含量可用于训练负荷监控和运动员恢复程度的评估。一般而言测定血清皮质醇可以评","定运动员肾上腺皮质的功能和恢复状况。当运动量过大、体内分解代谢旺盛、血清皮质醇升","高;睾酮/皮质醇比值则从一定意义上反映了机体的功能状况与疲劳积累程度。经过长期训练，","完成同样负荷运动时糖皮质激素和促肾上腺皮质激素水平也会降低。","生长激素对运动的反应和适应","运动时血浆中生长激素的浓度与运动时间和强度有关，表现为有一定的时间潜伏期和强度阈","值。在小负荷运动时,生长激素水平几乎不变;中等负荷运动时,生长激素水平有所增加，但有","一段时间潜伏期;大负荷运动时,生长激素水平显著增加。但要注意的是，血浆生长激素的增","加与运动强度并非呈直线变化关系，只有当运动强度达到某一阈值时，血浆生长激素才会升","高，且随负荷增加持续升高，甚至可达安静时的35倍之多。也有研究发现，以50%VO2max","强度运动时,生长激素水平变化不大，当以66%VO2max强度运动时,生长激素水平才明显增","加。因此，可以认为50%~60%VO2max运动强度范围为生长激素大量释放的临界强度阈值。","生长激素对长期运动适应主要表现在:受过训练者与未受过训练者相比,在完成相同强度负荷","时，前者血液中生长激素水平的增长幅度明显小于后者;力竭性运动后,前者血中生长激素的","恢复速率明显快于后者。","胰岛素和胰高血糖素对运动的反应和适应","运动时，胰岛素和胰高血糖素的变化表现为胰岛素降低、胰高血糖素升高。若以无训练者胰","岛素和胰高血糖素水平在急性运动的变化作为激素的应答性反应特征，将训练有素者的变化","作为对激素及长期运动训练的适应性变化,可见,训练有素者对同等负荷持续运动的良好适应","表现在:胰岛素虽有所降低，但下降幅度明显较小;胰高血糖素基本在安静水平徘徊，而在两","种激素的综合作用下，运动过程中血糖水平不仅未见降低，反而略有上升。"]},{"n":109,"t":"激素对运动时能量代谢的调控（低频）（p194）","a":["（1）对糖代谢的调控","（2）对脂肪代谢的调控"]},{"n":110,"t":"激素对运动时水盐代谢的调控（p195）","a":["（1）水盐平衡对于维持心血管功能和体温调节功能具有十分重要的作用。运动时，随着血","压的升高和发汗作用，水盐流失随之增多，肾血流量也减少，从而使得机体血浆容量降低。","水盐流失会大大降低运动能力。","（2）盐皮质激素和抗利尿激素调节着体内水盐和离子平衡，肾是其靶器官。体内的盐皮质","激素主要是醛固酮，可促进肾远曲小管和集合管对Na+和水的重吸收及 K+、H+的排泄。在","运动中，盐皮质激素分泌水平随着运动持续时间的延长而不断增加。在长时间运动中，如果","该激素分泌减少，将导致机体严重脱水和代谢性酸中毒。"]}]}],"count":13},{"title":"第五章 免疫与运动","full":"第五章（免疫与运动）","color":"#6a1b9a","groups":[{"g":"免疫系统与功能","qs":[{"n":111,"t":"特异性免疫的基本特征（旧版）","a":["（1）特异性","（2）多样性","（3）记忆性","（4）耐受性","（5）自限性"]},{"n":112,"t":"免疫的功能（p201）","a":["（1）免疫防御","（2）免疫稳定","（3）免疫监视"]},{"n":113,"t":"黏膜免疫防线的主要功能（p203）","a":["（1）阻抑黏附","（2）免疫排除作用","（3）溶解细菌","（4）中和病毒"]},{"n":114,"t":"单核-巨噬细胞的主要功能（p203）","a":["（1）吞噬、清除病原体和衰老、损伤的细胞","（2）作为主要的抗原呈递细胞，启动体液免疫和细胞免疫应答反应","（3）在体液免疫和细胞免疫效应阶段参与靶细胞即受感染细胞的破坏","（4）免疫监视功能","（5）发挥重要的分泌功能"]}]},{"g":"运动对免疫功能的影响","qs":[{"n":115,"t":"论述什么是“开窗”理论（p207）","a":["（1）这种理论认为，大强度急性运动时，应激激素的急剧升高以及血流动力学发生的急剧","变化，导致淋巴细胞等免疫细胞快速动员入血，使得淋巴细胞等数量在运动期间急剧升高，","淋巴细胞亚群比例发生明显改变。","（2）大强度运动后，淋巴细胞浓度下降，增殖分化能力及活性降低，免疫球蛋白含量及功","能也受到一定影响，出现免疫低下期。据研究，受一次性急性运动影响，免疫低下期可持续","3~72小时不等。","（3）在这一免疫低下期，各种细菌、病毒、微生物等病原体极易侵入人体并获得“插足”","的机会，表现为对疾病的易感率升高。一般形象地将这段免疫低下期称为“openwindow”，","意为“打开的窗户”，以此表明此阶段外界病原体极易侵入人体。","在此期间，运动员对感染性疾病的抵抗力下降，易感率上升。"]},{"n":116,"t":"免疫功能对运动的反应（p207）","a":["开窗理论+J形曲线模式"]},{"n":117,"t":"免疫功能对运动的适应（p208）","a":["健身锻炼适应性变化","（1）体液免疫功能增强：经常从事中等强度的体育锻炼，血浆中主要的免疫球蛋白IgA.IgG","会升高，黏膜表面所分泌的slgA（分泌型免疫球蛋白A，机体清除外来病原体的第一道防","线）增多，表明体液免疫功能增强。","（2）细胞免疫功能增强：经常参加体育锻炼者，淋巴细胞活性明显升高，在丝裂原刺激作","用下的细胞转化和增殖能力显著提升，表明细胞免疫功能得到提升。","（3）单核-巨噬细胞和中性粒细胞的功能增强：经常参加体育锻炼者，单核细胞和巨噬细胞","的抗原提呈能力增强，对外来病原体能够更有效地发动免疫应答。此外，作为机体非特异免","疫功能的重要组成部分，巨噬细胞和中性粒细胞的吞噬能力也显著增强。","健身锻炼改善免疫功能的机制","（1）有研究证实，肿瘤、高血压、糖尿病、冠心病、动脉硬化等威胁人类健康的主要慢性","病的形成，最初均起因于病灶部位慢性炎症的形成，并逐步加重，呈现进行性病变。","（2）而慢性炎症的形成，则是源于机体抗炎系统和促炎系统的平衡关系遭到破坏。在正常","情况下，机体的抗炎因子（IL-10，IL-6等细胞因子为代表）和促炎因子（IL-1，TNF-a等细","胞因子为代表）形成动态平衡，使得炎症在形成最初就得到及时清除。","（3）而在病理情况下，这种平衡被打破，促炎因子活性增高而抗炎因子活性降低，炎症更","易形成且难于及时清除，炎症就会形成并逐渐加重最终形成病变。","（4）经常参加体育锻炼能够增强免疫功能的机理正在于此。经常锻炼者抗炎性细胞因子活","性增强，而促炎性细胞因子的活性降低，从而可以及时清理机体局部可能形成的炎症，使炎","症难于形成与积累。","运动训练导致免疫功能降低具体表现：","（1）淋巴细胞数量减少，增殖能力明显降低，表明细胞免疫功能受到损伤。","（2）主要免疫球蛋白IgA，IgG以及重要补体C3和C4含量显著降低。","（3）剧烈运动后血浆儿茶酚胺和可的松浓度（应激激素，强烈的免疫抑制激素）明显升高，","并由此导致免疫细胞数量减少以及活性降低等免疫机能的负性变化。","（4）中性粒细胞吞噬作用降低，以及血液粒细胞氧化活性降低。","（5）NK细胞的细胞毒性（反映机体抗感染、抗病毒能力的重要指标）降低，丝裂原诱发","的淋巴细胞增殖作用（衡量T细胞功能）降低。","（6）持续时间较长、强度较大的运动训练会导致肌肉细胞受损，并继发性释放出炎性细胞","因子，使机体的抗炎-促炎机制失衡。","（7）在离体发生的对丝裂原和内毒素的反应过程中，所生成的细胞因子减少。表明在大负","荷运动之后，机体免疫系统产生细胞因子的能力降低。","（8）鼻腔和唾液的sIgA浓度降低，鼻腔黏液清除作用降低。表明上呼吸道清除外部病原体","的能力受损。","（9）主要组织相容性复合物MHC-II的表达以及巨噬细胞的抗原提呈作用降低。表明大负","荷运动会降低巨噬细胞MHC-H的表达，从而影响着向T淋巴细胞的抗原提呈过程。","运动训练抑制免疫功能的主要机制","（1）交感神经兴奋对免疫功能的抑制作用","（2）免疫调控信息物之间的平衡关系遭到破坏","（3）血糖浓度降低对免疫功能的抑制作用","（4）氧自由基升高对免疫细胞的破坏作用加强","（5）免疫抑制因子升高对免疫功能的负性影响","运动员免疫功能的自我防护（可单独出题）","（1）降低心理应激水平","（2）合理摄入营养","（3）保证睡眠，避免过度疲劳","（4）尽量减少感染机会","（5）患病期间运动应减量或停训"]}]}],"count":7},{"title":"第六章 血液与运动","full":"第六章（血液与运动）","color":"#00838f","groups":[{"g":"血液的组成与功能","qs":[{"n":28,"t":"简述血液的功能 （p70）","a":["（1）运输功能","（2）调节功能","（3）防御与保护功能"]}]},{"g":"血细胞与生理性止血","qs":[{"n":27,"t":"简述红细胞的生理特性 （p64）","a":["（1）可塑变形性","（2）悬浮稳定性","（3）渗透脆性"]},{"n":29,"t":"血小板的功能（简答）（p71）","a":["血小板在维持血管壁的完整性和生理性凝血过程中发挥重要作用，这些作用与其本身所具有","的黏附、释放、聚集、收缩和吸附等多种生理特性是分不开的。","（1）维持血管内皮的完整性。","（2）参与凝血和止血过程。"]},{"n":32,"t":"简述生理性止血的全过程（p71）","a":["生理性止血的过程主要包括血管收缩、血小板止血栓形成和血液凝固三个过程。","①首先表现为受损血管局部和附近的小血管收缩，使局部血流减少，有利于减轻或阻止出血。","②由于血管损伤后内皮下胶原的暴露，1~2s即有少量的血小板黏附于胶原上，黏附的血小","板释放活性物质，进一步激活、募集更多的血小板相互黏着而发生不可逆聚集，黏着聚集在","已经固定于胶原的血小板上，最终形成血小板止血栓堵塞伤口，达到初步的止血，也称为一","期止血。黏附于损伤处的血小板释放5-HT、TXA,等缩血管物质。","③血管受损也可启动凝血系统，在局部迅速发生血液凝固，使血浆中可溶性的纤维蛋白原转","变成不溶性的纤维蛋白并交织成网，以加固止血栓，称为二期止血。最后，局部纤维组织增","生，并长入血凝块，达到永久性止血。血液凝固是指血液由流动的状态变成不能流动的凝胶","状态的过程。其实质是血浆中的纤维蛋白原转变为不溶性的纤维蛋白的过程。该过程可以分","为凝血酶原酶复合物的形成、凝血酶原激活和纤维蛋白生成三个基本步骤。"]}]},{"g":"运动/低氧对血液的影响","qs":[{"n":30,"t":"论述运动对血液的影响（p72）","a":["（1）急性运动对血液的影响","①血浆容量：②血糖：③红细胞：④白细胞：","（2）长期运动对血液的影响","①血浆成分：②红细胞：③血红蛋白："]},{"n":31,"t":"高原训练和低氧训练对血液组成的影响（旧书）","a":["（1）目的：为了利用低氧环境，激发身体对低氧应激的生理适应，刺激机体造血系统，促","进红细胞生成，提高Hb和肌红蛋白的含量，从而增强血液运氧和肌肉利用氧的能力。","（2）机制：机体对低氧刺激的应激反应使储血器官释放红细胞进入循环血液，脱水使血液","浓缩等原因引起Hb、RBC、HCT等一过性升高，随后由于缺氧刺激，使肾生成的EPO增","加，引起骨髓造血功能加强，生成更多的红细胞，使Hb、HCT升高。进入高原环境12-24h","后，血液中的 EPO 开始升高。"]}]}],"count":6}];
function el(tag, cls, text){ var d=document.createElement(tag); if(cls) d.className=cls; if(text!=null) d.textContent=text; return d; }
function lineCls(t){ if(t.indexOf("※书中补充")===0||t.indexOf("※出处")===0) return "alnote";
  if(/^[（(]?[0-9０-９一二三四五六七八九十百]+[)）]?[.．、]/.test(t)) return "alhead";
  if(/^[①-⑳]/.test(t)) return "alhead"; if(/^[一二三四五六七八九十]+、/.test(t)) return "alhead"; return "altext"; }
var totalQ = 0;
(function build(){
  var map = document.getElementById("map");
  MIND.forEach(function(ch){
    totalQ += ch.count;
    var card = el("section","chapter"); card.style.setProperty("--c", ch.color);
    var head = el("div","chhead");
    head.appendChild(el("div","t", ch.title));
    var right = el("div","c", ch.count + " 题 · " + ch.groups.length + " 个板块");
    head.appendChild(right);
    head.appendChild(el("div","arrow","▼"));
    card.appendChild(head);
    var body = el("div","body");
    ch.groups.forEach(function(g){
      var gd = el("div","group");
      var gh = el("div","ghead"); gh.appendChild(document.createTextNode(g.g));
      gh.appendChild(el("span","n","（" + g.qs.length + "题）"));
      gd.appendChild(gh);
      var ul = el("ul","qs");
      g.qs.forEach(function(q){
        var li = el("li");
        var row = el("div","qrow");
        row.appendChild(el("span","num","#" + q.n));
        row.appendChild(el("span","qtext", q.t));
        li.appendChild(row);
        var ans = el("div","ans");
        (q.a||[]).forEach(function(t){ ans.appendChild(el("div", lineCls(t), t)); });
        row.addEventListener("click", function(){ ans.classList.toggle("open"); });
        li.appendChild(ans);
        ul.appendChild(li);
      });
      gd.appendChild(ul);
      body.appendChild(gd);
    });
    card.appendChild(body);
    head.addEventListener("click", function(){ card.classList.toggle("closed"); });
    map.appendChild(card);
  });
  document.getElementById("subline").textContent = "共 6 章 · " + totalQ + " 题 · 按「章节 → 知识板块 → 题目」组织";
  document.getElementById("rootSub").textContent = "共 6 章 · " + totalQ + " 题";
})();
document.getElementById("btnExpand").addEventListener("click", function(){
  document.querySelectorAll(".chapter").forEach(function(c){ c.classList.remove("closed"); }); });
document.getElementById("btnCollapse").addEventListener("click", function(){
  document.querySelectorAll(".chapter").forEach(function(c){ c.classList.add("closed"); }); });
document.getElementById("search").addEventListener("input", function(){
  var k = this.value.trim();
  document.querySelectorAll(".qrow").forEach(function(r){
    var hit = k && r.textContent.indexOf(k) >= 0;
    r.classList.toggle("hit", !!hit);
  });
  if(k){ document.querySelectorAll(".chapter").forEach(function(c){ c.classList.remove("closed"); }); }
});
</script>
